<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: html}">
<head>
    <title>ICSec Framework Explorer</title>
</head>
<body>
<div th:fragment="content">
    <!-- Hero -->
    <div class="text-center py-5 mb-4">
        <h1 class="display-5 fw-bold mb-3">
            <i class="bi bi-shield-lock-fill me-2 text-danger"></i>ICSec Framework Explorer
        </h1>
        <p class="lead text-muted mx-auto" style="max-width: 640px;">
            A companion application for the ICSec framework.
        </p>
        <div class="d-flex justify-content-center flex-wrap gap-3 mt-4">
            <a th:href="@{/assessment/all}" class="btn btn-outline-primary btn-lg px-4">
                <i class="bi bi-bar-chart-fill me-2"></i>Assessments
            </a>
            <a th:href="@{/topic/all}" class="btn btn-outline-warning btn-lg px-4">
                <i class="bi bi-collection me-2"></i>Control topics
            </a>
            <a th:href="@{/control/all}" class="btn btn-outline-success btn-lg px-4">
                <i class="bi bi-shield-check me-2"></i>Controls
            </a>
            <a th:href="@{/attack/techniques}" class="btn btn-outline-danger btn-lg px-4">
                <i class="bi bi-diagram-3 me-2"></i>ATT&amp;CK&#8482; techniques
            </a>
        </div>
    </div>


</div>
</body>
</html>
