<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${control.getCode()} + ' - ' + ${control.getName()}">Control</title>
    <style>
        @page {
            size: A4;
            margin: 2cm 1.8cm;
        }
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #212529;
            font-size: 11pt;
            line-height: 1.45;
        }
        h1 {
            font-size: 20pt;
            margin: 0 0 0.3em 0;
        }
        h2 {
            font-size: 13pt;
            margin: 1.4em 0 0.5em 0;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 0.2em;
        }
        p { margin: 0 0 0.6em 0; }
        .meta { margin-bottom: 0.8em; }
        .pill {
            display: inline-block;
            padding: 0.25em 0.7em;
            border-radius: 0.375rem;
            font-size: 9pt;
            font-weight: 600;
            margin-right: 0.4em;
        }
        .pill-topic { background-color: #212529; color: #fff; }
        .pill-cost {
            border: 1px solid #dc3545;
            color: #dc3545;
            background: #fff;
        }
        .muted { color: #6c757d; font-style: italic; }
        a { color: #0d6efd; text-decoration: none; word-break: break-all; }
        .card {
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 0.6em 0.8em;
            margin-bottom: 0.6em;
        }
        .card-title { font-weight: 700; margin: 0 0 0.4em 0; font-size: 11pt; }
        .badge {
            display: inline-block;
            padding: 0.2em 0.6em;
            border-radius: 0.375rem;
            font-size: 8.5pt;
            font-weight: 600;
            color: #fff;
            font-family: "Courier New", monospace;
        }
        .justification {
            margin-top: 0.5em;
            padding-top: 0.4em;
            border-top: 1px solid #eee;
            font-size: 9.5pt;
            white-space: pre-wrap;
        }
        .rel-badge {
            display: inline-block;
            padding: 0.2em 0.6em;
            border-radius: 0.375rem;
            font-size: 8.5pt;
            font-weight: 700;
            color: #fff;
            margin-right: 0.5em;
        }
        .rel-row { margin-bottom: 0.4em; }
        .description { white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1 th:text="${control.getName()}">Control name</h1>
    <div class="meta">
        <span class="pill pill-topic"
              th:text="${control.getTopic().getCode()} + ' - ' + ${control.getTopic().getName()}">Topic</span>
        <span class="pill pill-cost" th:text="'Cost Index: ' + ${control.getCostIndex()}">Cost Index</span>
        <span class="pill pill-cost" style="border-color:#6c757d;color:#6c757d;"
              th:text="${control.getCode()}">Code</span>
    </div>

    <p class="description" th:text="${control.getDescription()}">Description</p>

    <h2>References</h2>
    <p th:if="${#lists.isEmpty(control.getReferences())}" class="muted">No references.</p>
    <p th:unless="${#lists.isEmpty(control.getReferences())}"
       th:each="reference : ${control.getReferences()}">
        <a th:href="${reference}" th:text="${reference}">reference</a>
    </p>

    <h2>MITRE ATT&amp;CK Coverage</h2>
    <p th:if="${#lists.isEmpty(control.getTechniqueCoverage())}" class="muted">No technique coverage.</p>
    <div th:unless="${#lists.isEmpty(control.getTechniqueCoverage())}">
        <div class="card" th:each="coverage : ${control.getTechniqueCoverage()}">
            <p class="card-title" th:text="${coverage.getTechnique().getDisplayLabel()}">Technique</p>
            <span class="badge"
                  th:style="'background-color:' + ${coverage.getCoverageType().getHexColor()}"
                  th:text="${coverage.getCoverageType().getDisplayValue()} + ': ' + ${coverage.getCoverageRating()}">Type</span>
            <div class="justification" th:if="${coverage.getJustification()}"
                 th:text="${coverage.getJustification()}">Justification</div>
        </div>
    </div>

    <h2>Control Relationships</h2>
    <th:block th:with="outgoing=${control.getOutgoingRelationships()},incoming=${control.getIncomingRelationships()}">
        <p th:if="${#lists.isEmpty(outgoing) and #lists.isEmpty(incoming)}" class="muted">No relationships.</p>
        <div class="rel-row" th:each="rel : ${outgoing}">
            <span class="rel-badge" th:style="'background-color:' + ${rel.getType().getColor()}"
                  th:text="${rel.getDisplayName(control)}">Relation</span>
            <strong th:text="${rel.getTarget().getCode()}">CODE</strong>
            <span th:text="' - ' + ${rel.getTarget().getName()}">Name</span>
        </div>
        <div class="rel-row" th:each="rel : ${incoming}">
            <span class="rel-badge" th:style="'background-color:' + ${rel.getType().getColor()}"
                  th:text="${rel.getDisplayName(control)}">Relation</span>
            <strong th:text="${rel.getSource().getCode()}">CODE</strong>
            <span th:text="' - ' + ${rel.getSource().getName()}">Name</span>
        </div>
    </th:block>
</body>
</html>
