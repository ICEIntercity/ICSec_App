<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: html}">
<head>
    <th:block th:with="pageTitle='Controls'"></th:block>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-stretch mb-2">
        <div class="d-flex flex-column justify-content-between">
            <h1 class="mb-0">Controls</h1>
            <div th:if="${param.deleted}" class="alert alert-primary mb-0 py-1">
                Control deleted.
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-success" th:href="@{/control/new}">Add new control</a>
                <a class="btn btn-outline-secondary" th:href="@{/export/controls/pdf}">
                    <i class="bi bi-file-earmark-zip"></i> Export all (PDF)
                </a>
            </div>
        </div>
        <div class="d-flex flex-column align-items-center justify-content-center px-4 border-start">
            <span class="fw-bold lh-1" style="font-size: 4rem;" th:text="${totalControls}"></span>
            <span class="text-muted text-uppercase fw-semibold small">Controls</span>
        </div>
    </div>
    <div class="container-fluid py-4">
        <div th:each="topic : ${topics}" class="mb-5">
            <div class="d-flex align-items-center mb-3 gap-2">
                <span class="badge font-monospace fs-6"
                      th:classappend="${topic.getColor() == null ? 'bg-secondary' : ''}"
                      th:style="${topic.getColor() != null ? 'background-color: ' + topic.getColor() + '; color: ' + topic.getContrastColor() + ';' : ''}"
                      th:text="${topic.getCode()}"></span>
                <h4 class="mb-0 fw-bold" th:text="${topic.getName()}"></h4>
            </div>
            <div th:replace="~{fragments/controlList :: controlGrid(controlList=${topic.getControls()})}"></div>
            <hr class="mt-4">
        </div>
    </div>
</div>
</body>
</html>
