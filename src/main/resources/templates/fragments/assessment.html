<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="editModal" class="modal-content">
    <div class="modal-header">
        <h5 class="modal-title">Edit Assessment</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <form id="editAssessmentForm">
            <div class="mb-3">
                <label for="assessmentName" class="form-label">Name</label>
                <input type="text" class="form-control" id="assessmentName"
                       th:value="${assessment.getName()}" placeholder="Assessment name">
            </div>
            <div class="mb-3">
                <label for="assessmentDescription" class="form-label">Description</label>
                <textarea class="form-control" id="assessmentDescription"
                          rows="4" placeholder="Assessment description"
                          th:text="${assessment.getDescription()}"></textarea>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" data-bs-dismiss="modal" class="btn btn-primary"
                hx-on:click="const n = htmx.find('#assessmentName').value.trim();
                             htmx.find('input[name=name]').value = n;
                             htmx.find('input[name=description]').value = htmx.find('#assessmentDescription').value;
                             htmx.find('.sticky-top h3').textContent = n || 'New Assessment';">Save</button>
    </div>
</div>

<div th:fragment="controlDetailModal" class="modal-content d-none" id="controlDetailPanel">
    <div class="modal-header">
        <div>
            <span class="badge bg-secondary font-monospace me-2" id="modalControlCode"></span>
            <h5 class="modal-title d-inline" id="modalControlName"></h5>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="px-4 py-3 border-bottom bg-light">
        <div class="row g-3 align-items-end">
            <div class="col">
                <label class="form-label small text-muted mb-1" for="modalMaturity">Maturity</label>
                <select class="form-select form-select-sm" id="modalMaturity">
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
                <small class="text-muted mt-1 d-block" id="modalMaturityHint" style="min-height: 4.5em;"></small>
            </div>
            <div class="col">
                <label class="form-label small text-muted mb-1" for="modalScope">Scope</label>
                <select class="form-select form-select-sm" id="modalScope">
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
                <small class="text-muted mt-1 d-block" id="modalScopeHint" style="min-height: 4.5em;"></small>
            </div>
        </div>
    </div>
    <div class="modal-body">
        <div id="controlDetailContent"></div>
    </div>
</div>
</html>
