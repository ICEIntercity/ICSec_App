<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: html}">
<head>
    <th:block th:with="pageTitle='Assessment'"></th:block>
    <title>Assessment</title>
</head>
<body>
<div th:fragment="content">

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.querySelectorAll("[data-control-card]").forEach(function (card, index) {
                card.querySelector("[data-field='controlId']").name = `controlStatusMapping[${index}].controlId`;
                card.querySelector("[data-field='coverageMaturity']").name = `controlStatusMapping[${index}].coverageMaturity`;
                card.querySelector("[data-field='coverageScope']").name = `controlStatusMapping[${index}].coverageScope`;
            });
        });
    </script>

    <div class="modal fade" id="assessmentModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog" id="assessmentModalHolder">
            <div th:replace="~{fragments/assessment :: editModal}"></div>
        </div>
    </div>

    <div class="d-flex align-items-center justify-content-between sticky-top bg-white border-bottom py-2 mb-4">
        <h3 class="mb-0" th:text="${assessment.getName()} ?: 'New Assessment'">Assessment</h3>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary"
                    data-bs-toggle="modal"
                    data-bs-target="#assessmentModal">
                <i class="bi bi-pencil me-1"></i>Edit details
            </button>
            <button type="submit" form="assessmentForm" class="btn btn-primary">Save Assessment</button>
        </div>
    </div>

    <form id="assessmentForm" th:action="@{/assessment/save}" method="post" th:object="${assessment}">

        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{name}"/>
        <input type="hidden" th:field="*{description}"/>

        <div th:each="topicEntry : ${groupedStatusMap}" class="mb-5">
            <h5 class="border-bottom pb-2 mb-3">
                <span class="badge bg-dark font-monospace me-2" th:text="${topicEntry.key.getCode()}">XXX</span>
                <span th:text="${topicEntry.key.getName()}">Topic</span>
            </h5>

            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-3">
                <div class="col" th:each="controlEntry : ${topicEntry.value}">
                    <div data-control-card class="h-100">
                        <input type="hidden" data-field="controlId"
                               th:value="${controlEntry.key.getId()}"/>

                        <div class="card h-100 shadow-sm">
                            <div class="card-body d-flex flex-column">
                                <span class="badge bg-secondary font-monospace mb-1 align-self-start"
                                      th:text="${controlEntry.key.getCode()}">CODE</span>
                                <h6 class="card-title fw-bold mt-1 mb-3"
                                    th:text="${controlEntry.key.getName()}">Control Name</h6>

                                <div class="row g-2 mt-auto">
                                    <div class="col">
                                        <label class="form-label small text-muted mb-1"
                                               th:for="${'maturity-' + controlEntry.key.getId()}">Maturity</label>
                                        <select class="form-select form-select-sm"
                                                data-field="coverageMaturity"
                                                th:id="${'maturity-' + controlEntry.key.getId()}">
                                            <option th:each="i : ${#numbers.sequence(0, 5)}"
                                                    th:value="${i}"
                                                    th:text="${i}"
                                                    th:selected="${controlEntry.value.getCoverageMaturity() == i}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col">
                                        <label class="form-label small text-muted mb-1"
                                               th:for="${'scope-' + controlEntry.key.getId()}">Scope</label>
                                        <select class="form-select form-select-sm"
                                                data-field="coverageScope"
                                                th:id="${'scope-' + controlEntry.key.getId()}">
                                            <option th:each="i : ${#numbers.sequence(0, 5)}"
                                                    th:value="${i}"
                                                    th:text="${i}"
                                                    th:selected="${controlEntry.value.getCoverageScope() == i}">
                                            </option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </form>

</div>
</body>
</html>
