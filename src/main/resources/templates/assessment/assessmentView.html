<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: html}">
<head>
    <th:block th:with="pageTitle='Assessment'"></th:block>
    <title>Assessment</title>
</head>
<body>
<div th:fragment="content">

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.querySelectorAll("[data-control-card]").forEach(function (card, index) {
                card.querySelector("[data-field='controlId']").name = `controlStatusMapping[${index}].controlId`;
                card.querySelector("[data-field='coverageMaturity']").name = `controlStatusMapping[${index}].coverageMaturity`;
                card.querySelector("[data-field='coverageScope']").name = `controlStatusMapping[${index}].coverageScope`;
            });

            const maturityHints = [
                'Not implemented — no controls in place.',
                'Initial — ad hoc or informal implementation.',
                'Developing — exists but inconsistently applied.',
                'Defined — documented and consistently followed.',
                'Managed — monitored with measurable outcomes.',
                'Optimised — continuously improved and fully embedded.'
            ];
            const scopeHints = [
                'No coverage — control applies to no assets.',
                'Minimal — fewer than 20% of relevant assets.',
                'Partial — 20–40% of relevant assets.',
                'Moderate — 40–60% of relevant assets.',
                'Broad — 60–80% of relevant assets.',
                'Full — more than 80% of relevant assets.'
            ];

            const assessmentModal = document.getElementById('assessmentModal');
            const controlDetailPanel = document.getElementById('controlDetailPanel');
            const editPanel = assessmentModal.querySelector('.modal-content:not(#controlDetailPanel)');
            let activeCard = null;

            function updateHints() {
                document.getElementById('modalMaturityHint').textContent = maturityHints[document.getElementById('modalMaturity').value];
                document.getElementById('modalScopeHint').textContent = scopeHints[document.getElementById('modalScope').value];
            }

            assessmentModal.addEventListener('show.bs.modal', function (event) {
                const trigger = event.relatedTarget;
                if (trigger && trigger.hasAttribute('data-control-title')) {
                    editPanel.classList.add('d-none');
                    controlDetailPanel.classList.remove('d-none');
                    activeCard = trigger.closest('[data-control-card]');
                    populateControlModal(activeCard);
                } else {
                    controlDetailPanel.classList.add('d-none');
                    editPanel.classList.remove('d-none');
                    activeCard = null;
                }
            });

document.getElementById('modalMaturity').addEventListener('change', function () {
                if (activeCard) activeCard.querySelector('[data-field="coverageMaturity"]').value = this.value;
                updateHints();
            });

            document.getElementById('modalScope').addEventListener('change', function () {
                if (activeCard) activeCard.querySelector('[data-field="coverageScope"]').value = this.value;
                updateHints();
            });

            function populateControlModal(card) {
                document.getElementById('modalControlCode').textContent = card.dataset.controlCode;
                document.getElementById('modalControlName').textContent = card.dataset.controlName;
                document.getElementById('modalMaturity').value = card.querySelector('[data-field="coverageMaturity"]').value;
                document.getElementById('modalScope').value = card.querySelector('[data-field="coverageScope"]').value;
                updateHints();
                document.getElementById('controlDetailContent').innerHTML = '';
            }
        });
    </script>

    <div class="modal fade" id="assessmentModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable" id="assessmentModalHolder">
            <div th:replace="~{fragments/assessment :: editModal}"></div>
            <div th:replace="~{fragments/assessment :: controlDetailModal}"></div>
        </div>
    </div>

    <th:block th:if="${savedAssessmentId != null}">
        <div th:replace="~{fragments/assessmentStepper :: assessmentStepper(${savedAssessmentId}, 1, ${assessmentComplete})}"></div>
    </th:block>

    <div class="d-flex align-items-center justify-content-between sticky-top bg-white border-bottom py-2 mb-4">
        <h3 class="mb-0" th:text="${assessment.getName()} ?: 'New Assessment'">Assessment</h3>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary"
                    data-bs-toggle="modal"
                    data-bs-target="#assessmentModal">
                <i class="bi bi-pencil me-1"></i>Edit details
            </button>
            <button type="reset" form="assessmentForm" class="btn btn-outline-danger">
                <i class="bi bi-arrow-counterclockwise me-1"></i>Reset
            </button>
            <button type="submit" form="assessmentForm" class="btn btn-primary"><i class="bi bi-floppy me-1"></i>Save Assessment</button>
            <button type="submit" form="assessmentForm" class="btn btn-success"
                    onclick="document.getElementById('redirectTo').value='prioritize'">
                Save and continue <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </div>
    </div>

    <form id="assessmentForm" th:action="@{/assessment/save}" method="post" th:object="${assessment}">

        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{name}"/>
        <input type="hidden" th:field="*{description}"/>
        <input type="hidden" id="redirectTo" name="redirectTo" value=""/>

        <div th:each="topicEntry : ${groupedStatusMap}" class="mb-5">
            <h5 class="border-bottom pb-2 mb-3">
                <span class="badge font-monospace me-2"
                      th:classappend="${topicEntry.key.getColor() == null ? 'bg-secondary' : ''}"
                      th:style="${topicEntry.key.getColor() != null ? 'background-color: ' + topicEntry.key.getColor() + '; color: ' + topicEntry.key.getContrastColor() + ';' : ''}"
                      th:text="${topicEntry.key.getCode()}">XXX</span>
                <span th:text="${topicEntry.key.getName()}">Topic</span>
            </h5>

            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-3">
                <div class="col" th:each="controlEntry : ${topicEntry.value}">
                    <div data-control-card class="h-100"
                         th:data-control-name="${controlEntry.key.getName()}"
                         th:data-control-code="${controlEntry.key.getCode()}">
                        <input type="hidden" data-field="controlId"
                               th:value="${controlEntry.key.getId()}"/>

                        <div class="card h-100 shadow-sm">
                            <div class="card-body d-flex flex-column">
                                <span class="badge font-monospace mb-1 align-self-start"
                                      th:classappend="${controlEntry.key.getTopic().getColor() == null ? 'bg-secondary' : ''}"
                                      th:style="${controlEntry.key.getTopic().getColor() != null ? 'background-color: ' + controlEntry.key.getTopic().getColor() + '; color: ' + controlEntry.key.getTopic().getContrastColor() + ';' : ''}"
                                      th:text="${controlEntry.key.getCode()}">CODE</span>
                                <button type="button"
                                        class="btn btn-link p-0 text-start fw-bold text-body text-decoration-none mt-1 mb-3"
                                        style="font-size: 1rem; line-height: 1.2;"
                                        data-control-title
                                        data-bs-toggle="modal"
                                        data-bs-target="#assessmentModal"
                                        th:hx-get="@{/control/{id}/fragment(id=${controlEntry.key.getId()})}"
                                        hx-target="#controlDetailContent"
                                        hx-swap="innerHTML"
                                        th:text="${controlEntry.key.getName()}">Control Name</button>

                                <div class="row g-2 mt-auto">
                                    <div class="col">
                                        <label class="form-label small text-muted mb-1"
                                               th:for="${'maturity-' + controlEntry.key.getId()}">Maturity</label>
                                        <select class="form-select form-select-sm"
                                                data-field="coverageMaturity"
                                                th:id="${'maturity-' + controlEntry.key.getId()}">
                                            <option th:each="i : ${#numbers.sequence(0, 5)}"
                                                    th:value="${i}"
                                                    th:text="${i}"
                                                    th:selected="${controlEntry.value.getCoverageMaturity() == i}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col">
                                        <label class="form-label small text-muted mb-1"
                                               th:for="${'scope-' + controlEntry.key.getId()}">Scope</label>
                                        <select class="form-select form-select-sm"
                                                data-field="coverageScope"
                                                th:id="${'scope-' + controlEntry.key.getId()}">
                                            <option th:each="i : ${#numbers.sequence(0, 5)}"
                                                    th:value="${i}"
                                                    th:text="${i}"
                                                    th:selected="${controlEntry.value.getCoverageScope() == i}">
                                            </option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </form>

</div>
</body>
</html>
