<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: html}">
<head>
    <th:block th:with="pageTitle='Assessment Coverage'"></th:block>
    <title>Assessment Coverage</title>
</head>
<body>
<div th:fragment="content">

    <div class="modal fade" id="techniqueDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div id="techniqueDetailHolder"></div>
        </div>
    </div>

    <div th:replace="~{fragments/assessmentStepper :: assessmentStepper(${assessment.getId()}, 3, ${assessmentComplete})}"></div>

    <div class="d-flex align-items-center justify-content-between sticky-top bg-white border-bottom py-2 mb-4">
        <div>
            <h3 class="mb-0">MITRE Coverage Heatmap</h3>
            <small class="text-muted" th:text="${assessment.getName()}"></small>
        </div>
        <div class="d-flex gap-3 align-items-center">
            <div class="btn-group btn-group-sm" role="group" aria-label="View mode">
                <input type="radio" class="btn-check" name="viewMode" id="modeCoverage" autocomplete="off" checked>
                <label class="btn btn-outline-primary" for="modeCoverage">Coverage</label>
                <input type="radio" class="btn-check" name="viewMode" id="modePriority" autocomplete="off">
                <label class="btn btn-outline-primary" for="modePriority">Priority</label>
            </div>
            <div class="d-flex align-items-center gap-2" id="coverageTypeSelector">
                <label class="form-label mb-0 small text-muted fw-semibold">Coverage type</label>
                <select class="form-select form-select-sm" name="coverageType" style="width: auto;"
                        th:attr="hx-get=@{/assessment/{id}/coverage/heatmap(id=${assessment.getId()})}"
                        hx-target="#heatmap-container"
                        hx-trigger="change"
                        hx-include="this">
                    <option th:each="ct : ${coverageTypes}"
                            th:value="${ct.name()}"
                            th:text="${ct.getDisplayValue()}"
                            th:selected="${ct == selectedCoverageType}">
                    </option>
                </select>
            </div>
        </div>
    </div>

    <div id="heatmap-container">

        <div th:fragment="heatmap">
            <div th:each="tacticEntry : ${tacticsMap}" class="mb-5">
                <h5 class="border-bottom pb-2 mb-3">
                    <span class="badge bg-dark font-monospace me-2" th:text="${tacticEntry.key.getMitreId()}">TA0001</span>
                    <span th:text="${tacticEntry.key.getName()}">Tactic Name</span>
                </h5>

                <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-3">
                    <div class="col" th:each="technique : ${tacticEntry.value}">
                        <div class="card h-100 shadow-sm border-0"
                             th:attr="hx-get=@{/assessment/{assessmentId}/technique/{id}/coverage-detail(assessmentId=${assessment.getId()},id=${technique.getId()})},
                                      data-coverage-color=${techniqueColors[technique.getId()]},
                                      data-priority-color=${techniquePriorityColors[technique.getId()]}"
                             hx-target="#techniqueDetailHolder"
                             hx-swap="innerHTML"
                             data-bs-toggle="modal"
                             data-bs-target="#techniqueDetailModal"
                             th:style="'cursor: pointer; background-color: ' + ${techniqueColors[technique.getId()]}">
                            <div class="card-body d-flex flex-column p-3">
                                <div class="d-flex gap-2 mb-1 align-items-center">
                                    <span class="badge bg-danger font-monospace"
                                          th:text="${technique.getMitreId()}">T0001</span>
                                    <span class="badge priority-score-badge d-none"
                                          th:style="'background-color: white; border: 1px solid ' + ${coverageTypeHex} + '; color:' + ${coverageTypeHex} + ';'"
                                          data-bs-toggle="tooltip"
                                          data-bs-placement="bottom"
                                          title="Priority score = coverage gap × priority weight. Coverage gap measures how far the current failure probability exceeds the optimum (best achievable) failure probability."
                                          th:text="'Priority: ' + ${#numbers.formatDecimal(techniquePriorityScores[technique.getId()], 1, 'COMMA', 2, 'POINT')}">Priority: 0.00</span>
                                </div>
                                <p class="fw-semibold text-body mb-0 mt-1"
                                   style="font-size: 0.875rem; line-height: 1.3;"
                                   th:text="${technique.getName()}">Technique Name</p>
                                <div class="mt-auto pt-2">
                                    <small class="text-body fw-bold opacity-75"
                                           th:attr="data-coverage-score=${techniqueScores[technique.getId()]},
                                                    data-priority-score=${techniquePriorityScores[technique.getId()]},
                                                    data-priority-optimum-score=${techniqueOptimumScores[technique.getId()]}"
                                           th:text="${#numbers.formatDecimal(techniqueScores[technique.getId()], 1, 'COMMA', 2, 'POINT') + ' / 5'}">0.00 / 5</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        function applyViewMode() {
            const isCoverage = document.getElementById('modeCoverage').checked;
            document.querySelectorAll('.card[data-coverage-color]').forEach(card => {
                card.style.backgroundColor = isCoverage ? card.dataset.coverageColor : card.dataset.priorityColor;
            });
            document.querySelectorAll('small[data-coverage-score]').forEach(el => {
                if (isCoverage) {
                    el.textContent = parseFloat(el.dataset.coverageScore).toFixed(2) + ' / 5';
                } else {
                    const effective = parseFloat(el.dataset.coverageScore).toFixed(2);
                    const optimum = parseFloat(el.dataset.priorityOptimumScore).toFixed(2);
                    el.textContent = effective + ' / ' + optimum;
                }
            });
            document.querySelectorAll('.priority-score-badge').forEach(el => {
                el.classList.toggle('d-none', isCoverage);
            });
        }

        function initTooltips() {
            document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => {
                bootstrap.Tooltip.getOrCreateInstance(el);
            });
        }

        document.querySelectorAll('input[name="viewMode"]').forEach(radio => {
            radio.addEventListener('change', applyViewMode);
        });

        document.body.addEventListener('htmx:afterSwap', e => {
            if (e.detail.target.id === 'heatmap-container') {
                applyViewMode();
                initTooltips();
            }
        });

        initTooltips();
    </script>

</div>
</body>
</html>
