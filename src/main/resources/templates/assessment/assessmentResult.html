<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: html}">
<head>
    <th:block th:with="pageTitle='Assessment Coverage'"></th:block>
    <title>Assessment Coverage</title>
</head>
<body>
<div th:fragment="content">

    <div class="modal fade" id="techniqueDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div id="techniqueDetailHolder"></div>
        </div>
    </div>

    <div class="d-flex align-items-center justify-content-between sticky-top bg-white border-bottom py-2 mb-4">
        <div>
            <h3 class="mb-0">MITRE Coverage Heatmap</h3>
            <small class="text-muted" th:text="${assessment.getName()}"></small>
        </div>
        <div class="d-flex gap-3 align-items-center">
            <div class="d-flex align-items-center gap-2">
                <label class="form-label mb-0 small text-muted fw-semibold">Coverage type</label>
                <select class="form-select form-select-sm" name="coverageType" style="width: auto;"
                        th:attr="hx-get=@{/assessment/{id}/result/heatmap(id=${assessment.getId()})}"
                        hx-target="#heatmap-container"
                        hx-trigger="change"
                        hx-include="this">
                    <option th:each="ct : ${coverageTypes}"
                            th:value="${ct.name()}"
                            th:text="${ct.getDisplayValue()}"
                            th:selected="${ct == selectedCoverageType}">
                    </option>
                </select>
            </div>
            <a th:href="@{/assessment/{id}/prioritize(id=${assessment.getId()})}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Prioritization
            </a>
        </div>
    </div>

    <div id="heatmap-container">

        <div th:fragment="heatmap">
            <div th:each="tacticEntry : ${tacticsMap}" class="mb-5">
                <h5 class="border-bottom pb-2 mb-3">
                    <span class="badge bg-dark font-monospace me-2" th:text="${tacticEntry.key.getMitreId()}">TA0001</span>
                    <span th:text="${tacticEntry.key.getName()}">Tactic Name</span>
                </h5>

                <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-3">
                    <div class="col" th:each="technique : ${tacticEntry.value}">
                        <div class="card h-100 shadow-sm border-0"
                             style="cursor: pointer;"
                             th:attr="hx-get=@{/technique/{id}/coverage-detail(id=${technique.getId()})}"
                             hx-target="#techniqueDetailHolder"
                             hx-swap="innerHTML"
                             data-bs-toggle="modal"
                             data-bs-target="#techniqueDetailModal"
                             th:style="'cursor: pointer; background-color: ' + ${techniqueColors[technique.getId()]}">
                            <div class="card-body d-flex flex-column p-3">
                                <span class="badge bg-danger font-monospace mb-1 align-self-start"
                                      th:text="${technique.getMitreId()}">T0001</span>
                                <p class="fw-semibold text-body mb-0 mt-1"
                                   style="font-size: 0.875rem; line-height: 1.3;"
                                   th:text="${technique.getName()}">Technique Name</p>
                                <div class="mt-auto pt-2">
                                    <small class="text-body fw-bold opacity-75"
                                           th:text="${#numbers.formatDecimal(techniqueScores[technique.getId()], 1, 'COMMA', 1, 'POINT') + ' / 5'}">0.0 / 5</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

</div>
</body>
</html>
