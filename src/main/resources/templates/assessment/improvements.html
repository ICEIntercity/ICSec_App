<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: html}">
<head>
    <th:block th:with="pageTitle='Improvements'"></th:block>
    <title>Improvements</title>
</head>
<body>
<div th:fragment="content">

    <div th:replace="~{fragments/assessmentStepper :: assessmentStepper(${assessment.getId()}, 4, ${assessmentComplete}, null, null)}"></div>

    <div class="sticky-top bg-white border-bottom py-2 mb-4">
        <h3 class="mb-0">Coverage Improvement Heatmap</h3>
        <small class="text-muted" th:text="${assessment.getName()}"></small>
    </div>

    <div class="mb-5">
        <h4 class="fw-bold mb-3">Top 5 by Coverage Improvement</h4>
        <div class="row row-cols-5 g-3">
            <div class="col" th:each="entry : ${topFive}">
                <div class="card border-0 shadow"
                     style="cursor:pointer"
                     th:attr="data-gain=${entry.value},
                              data-topic-color=${entry.key.getTopic().getColor() ?: '#6c757d'},
                              data-control-id=${entry.key.getId()}">
                    <div class="card-body p-3 d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <span class="badge bg-secondary font-monospace"
                                  style="font-size: 0.7rem;"
                                  th:text="${entry.key.getCode()}"></span>
                            <span class="badge bg-dark"
                                  style="font-size: 0.7rem;"
                                  th:text="'#' + ${rankMap.get(entry.key.getId())}"></span>
                        </div>
                        <p class="fw-semibold mb-1" style="font-size: 0.875rem; line-height: 1.3;"
                           th:text="${entry.key.getName()}">Control Name</p>
                        <small class="text-muted" th:text="${entry.key.getTopic().getName()}"></small>
                        <div class="mt-auto pt-2 d-flex justify-content-between align-items-end gap-1">
                            <span class="badge bg-primary-subtle text-primary-emphasis"
                                  style="font-size: 0.65rem;"
                                  th:text="${adviceMap.get(entry.key.getId())}">Increase coverage</span>
                            <small class="fw-bold opacity-75"
                                   th:text="${#numbers.formatDecimal(entry.value, 1, 'COMMA', 2, 'POINT')}">0.00</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <hr class="mb-4">
    <h4 class="fw-bold mb-4">Detailed Overview</h4>

    <div th:each="topicEntry : ${groupedGains}" class="mb-5">
        <div class="d-flex align-items-center mb-3 gap-2">
            <span class="badge font-monospace"
                  th:classappend="${topicEntry.key.getColor() == null ? 'bg-secondary' : ''}"
                  th:style="${topicEntry.key.getColor() != null ?
                      'background-color: ' + topicEntry.key.getColor() + '; color: ' + topicEntry.key.getContrastColor() + ';'
                      : ''}"
                  th:text="${topicEntry.key.getCode()}"></span>
            <h5 class="mb-0 fw-semibold" th:text="${topicEntry.key.getName()}"></h5>
        </div>

        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-2">
            <div class="col" th:each="controlEntry : ${topicEntry.value}">
                <div class="card h-100 border-0 shadow-sm"
                     style="cursor:pointer"
                     th:attr="data-gain=${controlEntry.value},
                              data-topic-color=${topicEntry.key.getColor() ?: '#6c757d'},
                              data-control-id=${controlEntry.key.getId()}">
                    <div class="card-body p-2 d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-start mb-1">
                            <span class="badge bg-secondary font-monospace"
                                  style="font-size: 0.7rem;"
                                  th:text="${controlEntry.key.getCode()}"></span>
                            <span class="badge bg-dark"
                                  style="font-size: 0.7rem;"
                                  th:text="'#' + ${rankMap.get(controlEntry.key.getId())}"></span>
                        </div>
                        <p class="fw-semibold mb-0" style="font-size: 0.8rem; line-height: 1.3;"
                           th:text="${controlEntry.key.getName()}">Control Name</p>
                        <div class="mt-auto pt-2 d-flex justify-content-between align-items-end gap-1">
                            <span class="badge bg-primary-subtle text-primary-emphasis"
                                  style="font-size: 0.6rem;"
                                  th:text="${adviceMap.get(controlEntry.key.getId())}">Increase coverage</span>
                            <small class="fw-bold opacity-75"
                                   th:text="${#numbers.formatDecimal(controlEntry.value, 1, 'COMMA', 2, 'POINT')}">0.00</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Control detail modal -->
    <div class="modal fade" id="controlDetailModal" tabindex="-1" aria-labelledby="controlDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header pb-2">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <span class="badge bg-secondary font-monospace" style="font-size:0.75rem;" id="modalControlCode"></span>
                            <h5 class="modal-title mb-0 fw-bold" id="controlDetailModalLabel"></h5>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <small class="text-muted" id="modalTopicName"></small>
                            <span class="badge bg-primary-subtle text-primary-emphasis" id="modalAdvice"></span>
                        </div>
                    </div>
                    <button type="button" class="btn-close ms-3" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted mb-4" id="modalControlDescription" style="font-size:0.9rem;"></p>
                    <h6 class="fw-semibold mb-3">Technique Coverage Gains</h6>
                    <div class="row row-cols-2 row-cols-md-3 g-2" id="modalTechniqueCards"></div>
                    <p class="text-muted fst-italic mt-2 d-none" id="modalNoGains" style="font-size:0.85rem;">
                        This control is already at maximum coverage — no additional gain available.
                    </p>
                </div>
                <div class="modal-footer">
                    <a id="modalControlLink" href="#" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-box-arrow-up-right me-1"></i>View full control
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function hexToRgb(hex) {
            return [
                parseInt(hex.slice(1, 3), 16),
                parseInt(hex.slice(3, 5), 16),
                parseInt(hex.slice(5, 7), 16)
            ];
        }

        function interpolateToWhite(topicHex, ratio) {
            const [r, g, b] = hexToRgb(topicHex);
            return `rgb(${Math.round(255 + (r - 255) * ratio)}, ${Math.round(255 + (g - 255) * ratio)}, ${Math.round(255 + (b - 255) * ratio)})`;
        }

        const cards = Array.from(document.querySelectorAll('.card[data-gain]'));
        const gains = cards.map(c => parseFloat(c.dataset.gain));
        const maxGain = Math.max(...gains, 0);
        cards.forEach((card, i) => {
            const ratio = maxGain > 0 ? gains[i] / maxGain : 0;
            card.style.backgroundColor = interpolateToWhite(card.dataset.topicColor, ratio);
        });
    </script>

    <div id="controlDataJson" hidden th:text="${controlDataJson}"></div>

    <script>
        const controlData = JSON.parse(document.getElementById('controlDataJson').textContent);
        const modalEl = document.getElementById('controlDetailModal');

        document.querySelectorAll('.card[data-control-id]').forEach(card => {
            card.addEventListener('click', () => {
                const id = card.dataset.controlId;
                const data = controlData[id];
                if (!data) return;

                document.getElementById('modalControlCode').textContent = data.code;
                document.getElementById('controlDetailModalLabel').textContent = data.name;
                document.getElementById('modalTopicName').textContent = data.topicName;
                document.getElementById('modalAdvice').textContent = data.advice;
                document.getElementById('modalControlLink').href = '/control/' + id;

                const descEl = document.getElementById('modalControlDescription');
                if (data.description) {
                    descEl.textContent = data.description;
                    descEl.classList.remove('d-none');
                } else {
                    descEl.classList.add('d-none');
                }

                const techContainer = document.getElementById('modalTechniqueCards');
                techContainer.innerHTML = '';
                const noGainsEl = document.getElementById('modalNoGains');

                const adviceEl = document.getElementById('modalAdvice');
                const gainfulTechniques = data.techniques.filter(t => t.gain > 0.001);
                if (gainfulTechniques.length === 0) {
                    noGainsEl.classList.remove('d-none');
                    adviceEl.classList.add('d-none');
                } else {
                    noGainsEl.classList.add('d-none');
                    adviceEl.classList.remove('d-none');
                    gainfulTechniques.forEach(t => {
                        const col = document.createElement('div');
                        col.className = 'col';
                        const techCard = document.createElement('div');
                        techCard.className = 'card border-0 bg-light h-100';
                        const body = document.createElement('div');
                        body.className = 'card-body p-2 d-flex flex-column';

                        const idBadge = document.createElement('span');
                        idBadge.className = 'badge bg-secondary font-monospace mb-1 align-self-start';
                        idBadge.style.fontSize = '0.7rem';
                        idBadge.textContent = t.mitreId;

                        const techName = document.createElement('p');
                        techName.className = 'fw-semibold mb-0 mt-auto';
                        techName.style.cssText = 'font-size:0.8rem;line-height:1.3;';
                        techName.textContent = t.name;

                        const gainEl = document.createElement('small');
                        gainEl.className = 'fw-bold text-success mt-1';
                        gainEl.textContent = '+' + t.gain.toFixed(2);

                        body.appendChild(idBadge);
                        body.appendChild(techName);
                        body.appendChild(gainEl);
                        techCard.appendChild(body);
                        col.appendChild(techCard);
                        techContainer.appendChild(col);
                    });
                }

                bootstrap.Modal.getOrCreateInstance(modalEl).show();
            });
        });
    </script>

</div>
</body>
</html>
