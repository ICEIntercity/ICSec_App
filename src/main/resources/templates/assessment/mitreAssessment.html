<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: html}">
<head>
    <th:block th:with="pageTitle='MITRE Prioritization'"></th:block>
    <title>MITRE Prioritization</title>
</head>
<body>
<div th:fragment="content">

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.querySelectorAll("[data-technique-card]").forEach(function (card, index) {
                card.querySelector("[data-field='techniqueId']").name = `priorities[${index}].techniqueId`;
                card.querySelector("[data-field='priority']").name = `priorities[${index}].priority`;
            });

            const priorityLabels = [
                'Not relevant',
                'Very low priority',
                'Low priority',
                'Medium priority',
                'High priority',
                'Very high priority'
            ];

            document.querySelectorAll("[data-field='priority']").forEach(function (select) {
                const hint = select.closest('[data-technique-card]').querySelector('[data-priority-hint]');
                function updateHint() {
                    if (hint) hint.textContent = priorityLabels[select.value];
                }
                select.addEventListener('change', updateHint);
                updateHint();
            });
        });
    </script>

    <div th:replace="~{fragments/assessmentStepper :: assessmentStepper(${assessment.getId()}, 2, ${assessmentComplete}, 'mitreForm', 'result')}"></div>

    <div class="sticky-top bg-white border-bottom py-2 mb-4">
        <h3 class="mb-0">MITRE ATT&amp;CK Prioritization</h3>
        <small class="text-muted" th:text="${assessment.getName()}"></small>
    </div>

    <form id="mitreForm" th:action="@{/assessment/{id}/prioritize(id=${assessment.getId()})}" method="post">

        <div th:each="tacticEntry : ${tacticsMap}" class="mb-5">
            <h5 class="border-bottom pb-2 mb-3">
                <span class="badge bg-dark font-monospace me-2" th:text="${tacticEntry.key.getMitreId()}">TA0001</span>
                <span th:text="${tacticEntry.key.getName()}">Tactic Name</span>
            </h5>

            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-3">
                <div class="col" th:each="technique : ${tacticEntry.value}">
                    <div data-technique-card class="h-100">
                        <input type="hidden" data-field="techniqueId" th:value="${technique.getId()}"/>

                        <div class="card h-100 shadow-sm">
                            <div class="card-body d-flex flex-column">
                                <span class="badge bg-danger font-monospace mb-1 align-self-start"
                                      th:text="${technique.getMitreId()}">T0001</span>
                                <p class="fw-bold text-body mb-3 mt-1"
                                   style="font-size: 1rem; line-height: 1.2;"
                                   th:text="${technique.getName()}">Technique Name</p>

                                <div class="mt-auto">
                                    <label class="form-label small text-muted mb-1">Priority</label>
                                    <select class="form-select form-select-sm" data-field="priority">
                                        <option th:each="i : ${#numbers.sequence(0, 5)}"
                                                th:value="${i}"
                                                th:text="${i}"
                                                th:selected="${existingPriorities[technique.getId()] != null ? existingPriorities[technique.getId()].intValue() == i : i == 3}">
                                        </option>
                                    </select>
                                    <small class="text-muted d-block mt-1" data-priority-hint></small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </form>

</div>
</body>
</html>
